footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px 16px 28px}
footer a{color:inherit}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--band);color:var(--on-band);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30}

<script>
(function(){

var SETS={

    note:'نسخة الجريدة الرسمية لهذا القانون صور ممسوحة ضوئيًا؛ لذلك تُعرض كل مادة كقصاصة من صورة الجريدة نفسها، والبحث يتم على نص مقروء آليًا (OCR) قد تفوته بعض الكلمات وتختلف فيه الأرقام، فاعتمد دائمًا على الصورة.'},
  regs:{file:'ins-regs-2021.json',pages:'regs-pages/',maxp:250,pre:'R',kind:'text',max:319,
    topics:['أجر الاشتراك','دخل الاشتراك','نسب الاشتراكات','ملف التأمين','إجراءات الاشتراك','نموذج','التقسيط','المعاش','إصابة العمل','الفحص الطبي','تعويض الأجر','البطالة','المقاولات','النقل البري','المستحقين','مستندات الصرف'],
    note:'النص مستخرج آليًا من النسخة الإلكترونية للجريدة الرسمية، وفيه أخطاء ترتيب حروف في بعض الكلمات والمعادلات؛ المرجع هو صورة الصفحة الأصلية المتاحة تحت كل مادة.'}
};
var cur='labor', DATA={}, ARTS=[], vPage=1;
var ORD=['','الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة','الحادية عشرة','الثانية عشرة','الثالثة عشرة'];
function $(s){return document.querySelector(s)}
function el(t,a,c){var e=document.createElement(t);for(var k in (a||{}))e.setAttribute(k,a[k]);if(c!=null)e.textContent=c;return e}

function norm(s){return String(s).replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).toLowerCase()}
function C(){return SETS[cur]}
function label(a){if(a.k==='tbl')return a.label;return a.k==='iss'?'المادة '+ORD[a.n]+' (من مواد الإصدار)':'المادة ('+a.n+')'}
function aid(a){return C().pre+'-'+(a.k==='iss'?'i':a.k==='tbl'?'t':'m')+a.n}
function txtOf(a){return a.p?a.p.join(' '):(a.ocr||'')}

function index(){
  var d=DATA[cur];var list=d.articles.concat(d.tables||[]);
  ARTS=list.map(function(a){var n=norm(txtOf(a)+' '+(a.title||'')+' '+(a.label||''));return Object.assign({},a,{ns:n,nn:n.replace(/\s+/g,''),hs:norm((a.part||'')+' '+(a.chap||''))})});
  var sel=$('#scope');sel.innerHTML='';sel.appendChild(el('option',{value:''},'كل النص'));var seen={};
  ARTS.forEach(function(a){var key=a.part+'|'+a.chap;if(!a.part||seen[key])return;seen[key]=1;sel.appendChild(el('option',{value:key},a.chap?a.part.split(':')[0]+' › '+a.chap:a.part))});
  $('#srcTitle').textContent=d.title;$('#srcName').textContent=d.source;$('#srcNote').textContent=C().note;
  var ch=$('#chips');ch.innerHTML='';C().topics.forEach(function(t){var b=el('button',{class:'chip',type:'button'},t);b.addEventListener('click',function(){$('#q').value=t;$('#scope').value='';render()});ch.appendChild(b)});
}
function highlight(text,terms){
  if(!terms.length)return [document.createTextNode(text)];
  var map=[],nt='';for(var i=0;i<text.length;i++){var c=norm(text[i]);for(var j=0;j<c.length;j++)map.push(i);nt+=c}
  var ranges=[];terms.forEach(function(t){if(t.length<2)return;var p=0;while((p=nt.indexOf(t,p))>-1){ranges.push([map[p],map[p+t.length-1]+1]);p+=t.length}});

  var out=[],pos=0;ranges.forEach(function(r){if(r[0]<pos)return;out.push(document.createTextNode(text.slice(pos,r[0])));out.push(el('mark',null,text.slice(r[0],r[1])));pos=r[1]});

}
function linkify(nodes){
  var pre=C().pre,res=[];nodes.forEach(function(nd){
    if(nd.nodeType!==3){res.push(nd);return}
    var s=nd.textContent,re=/(المادة|المادتين|المواد|بالمادة|للمادة)\s*\(?\s*(\d{1,3})\s*\)?/g,m,last=0;

    res.push(document.createTextNode(s.slice(last)));
  });return res;
}
function crop(seg){
  var d=DATA[cur],p=seg[0],x0=seg[1],y0=seg[2],x1=seg[3],y1=seg[4],pw=d.pw[p],cw=x1-x0,ch=y1-y0;
  var box=el('div',{class:'crop'});box.style.paddingTop=(ch/cw*100)+'%';
  var im=el('img',{src:C().pages+'p'+String(p).padStart(3,'0')+'.webp',alt:'',loading:'lazy'});
  im.style.width=(pw/cw*100)+'%';im.style.marginLeft=(-x0/cw*100)+'%';im.style.marginTop=(-y0/cw*100)+'%';
  box.appendChild(im);return box;
}
function card(a,terms,full){
  var c=el('article',{class:'art',id:aid(a)});
  var h=el('div',{class:'ah'});h.appendChild(el('h3',null,label(a)));
  h.appendChild(el('span',{class:'crumb'},[a.book&&a.book.split(':')[0],a.part,a.chap].filter(Boolean).join(' › ')));c.appendChild(h);
  if(a.k==='tbl'){
    if(a.title)c.appendChild(el('p',null,a.title));
    var pp=el('div',{class:'acts'});for(var q=a.pages[0];q<=a.pages[1];q++){(function(q){var b=el('button',{class:'btn',type:'button'},'📄 ص '+q);b.addEventListener('click',function(){openPage(q,a.label)});pp.appendChild(b)})(q)}
    c.appendChild(pp);return c;
  }
  if(a.seg){
    var sc=el('div',{class:'scan'});a.seg.forEach(function(s){sc.appendChild(crop(s))});c.appendChild(sc);
    if(terms.length){var hit=a.ocr.split('\n').filter(function(l){var n=norm(l);return terms.some(function(t){return n.indexOf(t)>-1})}).slice(0,2);hit.forEach(function(l){var p=el('p',{class:'ocrhit'});highlight(l,terms).forEach(function(n){p.appendChild(n)});c.appendChild(p)})}
    var det=el('details',{class:'ocr'});det.appendChild(el('summary',null,'النص المقروء آليًا (للبحث فقط، قد يحتوي أخطاء)'));a.ocr.split('\n').forEach(function(l){det.appendChild(el('p',null,l))});c.appendChild(det);
  } else {
    var ps=a.p,cut=false;
    if(!full&&ps.length>4){var hit2=terms.length?ps.findIndex(function(x){var n=norm(x);return terms.some(function(t){return n.indexOf(t)>-1})}):0;hit2=Math.max(0,hit2);ps=ps.slice(Math.max(0,hit2-1),Math.max(0,hit2-1)+3);cut=true}
    ps.forEach(function(t){var p=el('p',/^\d+-/.test(t)?{class:'li'}:null);linkify(highlight(t,terms)).forEach(function(n){p.appendChild(n)});c.appendChild(p)});
    if(cut){var mb=el('button',{class:'btn',type:'button',style:'margin-top:8px'},'عرض نص المادة كاملًا');mb.addEventListener('click',function(){c.replaceWith(card(a,terms,true))});c.appendChild(mb)}
  }
  var acts=el('div',{class:'acts'});
  var img=el('button',{class:'btn',type:'button'},'📄 صورة الصفحة الأصلية (ص '+a.page+')');img.addEventListener('click',function(){openPage(a.page,label(a))});acts.appendChild(img);
  if(a.p){var cp=el('button',{class:'btn',type:'button'},'نسخ النص مع المرجع');cp.addEventListener('click',function(){copy(label(a)+' من '+DATA[cur].title+':\n'+a.p.join('\n')+'\n('+DATA[cur].source+')')});acts.appendChild(cp)}
  else{var cr=el('button',{class:'btn',type:'button'},'نسخ المرجع');cr.addEventListener('click',function(){copy(label(a)+' من '+DATA[cur].title+' ('+DATA[cur].source+'، ص '+a.page+')')});acts.appendChild(cr)}
  var ln=el('button',{class:'btn',type:'button'},'🔗 رابط المادة');ln.addEventListener('click',function(){copy(location.href.split('#')[0]+'#'+aid(a))});acts.appendChild(ln);
  c.appendChild(acts);return c;
}
function copy(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('اتنسخ')},function(){toast('النسخ غير متاح هنا')})}else toast('النسخ غير متاح هنا')}

function render(){
  var out=$('#out');out.innerHTML='';if(!DATA[cur])return;
  var raw=$('#q').value.trim(),scope=$('#scope').value;$('#clearQ').hidden=!raw;
  var list=ARTS.filter(function(a){return !scope||(a.part+'|'+a.chap)===scope});
  var num=raw.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).match(/^(?:م|مادة|المادة)?\s*\(?\s*(\d{1,3})\s*\)?$/);
  if(num){var a=ARTS.filter(function(x){return x.k==='law'&&x.n===+num[1]})[0];$('#count').textContent=a?'مادة واحدة':'لا توجد مادة بهذا الرقم (المواد من 1 إلى '+C().max+')';if(a)out.appendChild(card(a,[],true));return}
  if(!raw&&!scope){renderToc(out);return}
  var terms=norm(raw).split(/\s+/).map(function(t){return t.replace(/^(وال|بال|فال|كال|لل|ال)(?=.{3,})/,'')}).filter(function(t){return t.length>1});
  var res=terms.length?list.filter(function(a){return terms.every(function(t){return a.ns.indexOf(t)>-1||a.nn.indexOf(t)>-1||a.hs.indexOf(t)>-1})}):list;
  var phrase=norm(raw);
  res=res.map(function(a){var sc=(a.ns.indexOf(phrase)>-1?100:0)+(a.hs.indexOf(phrase.replace(/^ال/,''))>-1?60:0);terms.forEach(function(t){sc+=a.ns.split(t).length-1});return [sc,a]}).sort(function(x,y){return y[0]-x[0]||((x[1].k==='law'?1e3:0)+x[1].n)-((y[1].k==='law'?1e3:0)+y[1].n)}).map(function(x){return x[1]});
  $('#count').textContent=res.length?(res.length+' نتيجة'):'';
  if(!res.length){out.appendChild(el('p',{class:'empty'},'مفيش نتائج. جرّب كلمة أقصر أو مرادف، أو اكتب رقم المادة.'));return}
  res.slice(0,40).forEach(function(a){out.appendChild(card(a,terms,false))});
  if(res.length>40)out.appendChild(el('p',{class:'more'},'ظاهر أول 40 نتيجة. ضيّق البحث بكلمة إضافية أو اختار قسم.'));
}
function renderToc(out){
  var nLaw=ARTS.filter(function(a){return a.k==='law'}).length;
  $('#count').textContent=nLaw+' مادة · تصفح حسب الأبواب والفصول';
  var box=el('div',{class:'toc'}),lastBook=null,groups=[],g=null;
  ARTS.forEach(function(a){var key=a.part+'|'+a.chap;if(!g||g.key!==key){g={key:key,book:a.book,part:a.part,chap:a.chap,arts:[]};groups.push(g)}g.arts.push(a)});
  var byPart=[],pp=null;groups.forEach(function(x){if(!pp||pp.part!==x.part||pp.book!==x.book){pp={book:x.book,part:x.part,chaps:[]};byPart.push(pp)}pp.chaps.push(x)});
  byPart.forEach(function(p){
    if(p.book!==lastBook&&p.book){box.appendChild(el('div',{class:'book'},p.book));lastBook=p.book}
    var d=el('div',{class:'part'}),b=el('button',{type:'button','aria-expanded':'false'});
    var arts=[].concat.apply([],p.chaps.map(function(c){return c.arts})),first=arts[0],last=arts[arts.length-1];
    b.appendChild(document.createTextNode(p.part||'—'));b.appendChild(el('span',null,first.k==='law'?'م '+first.n+' – '+last.n:arts.length+(first.k==='tbl'?' بند':' مواد')));
    var ul=el('ul');ul.hidden=true;
    p.chaps.forEach(function(c){var li=el('li'),bt=el('button',{type:'button'});bt.appendChild(document.createTextNode(c.chap||p.part));var f=c.arts[0],l=c.arts[c.arts.length-1];bt.appendChild(el('span',null,f.k==='law'?'م '+f.n+' – '+l.n:''));bt.addEventListener('click',function(){$('#scope').value=c.key;$('#q').value='';render();window.scrollTo({top:0})});li.appendChild(bt);ul.appendChild(li)});
    b.addEventListener('click',function(){ul.hidden=!ul.hidden;b.setAttribute('aria-expanded',String(!ul.hidden))});
    d.appendChild(b);d.appendChild(ul);box.appendChild(d);
  });
  out.appendChild(box);
}
function openPage(p,title){vPage=p;$('#vTitle').textContent=(title?title+' · ':'')+'الجريدة الرسمية – صفحة '+p;$('#vImg').src=C().pages+'p'+String(p).padStart(3,'0')+'.webp';$('#viewer').hidden=false;$('#vClose').focus()}
function load(set,cb){
  cur=set;document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.law===set))});
  try{localStorage.setItem('mhh-law-tab',set)}catch(e){}
  if(DATA[set]){index();cb?cb():render();return}
  $('#out').innerHTML='';$('#out').appendChild(el('p',{class:'empty'},'جارٍ التحميل…'));
  fetch(SETS[set].file).then(function(r){return r.json()}).then(function(d){DATA[set]=d;if(cur!==set)return;index();cb?cb():render()}).catch(function(){$('#out').innerHTML='';$('#out').appendChild(el('p',{class:'empty'},'تعذّر التحميل. أعد تحميل الصفحة.'))});
}
function goHash(){
  var m=location.hash.match(/^#(?:([LTR])-)?([mit])(\d{1,3})$/);if(!m)return false;
  var set={L:'labor',T:'ins',R:'regs'}[m[1]||'L'];
  load(set,function(){var k={m:'law',i:'iss',t:'tbl'}[m[2]];var a=ARTS.filter(function(x){return x.k===k&&x.n===+m[3]})[0];if(!a){render();return}
    $('#q').value='';$('#scope').value='';var out=$('#out');out.innerHTML='';$('#count').textContent=label(a);out.appendChild(card(a,[],true));window.scrollTo({top:0})});
  return true;
}
/* events */
var tmr;$('#q').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(render,160)});
$('#clearQ').addEventListener('click',function(){$('#q').value='';render();$('#q').focus()});
$('#scope').addEventListener('change',render);
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){$('#q').value='';$('#scope').value='';history.replaceState(null,'',location.pathname);load(b.dataset.law)})});
$('#vClose').addEventListener('click',function(){$('#viewer').hidden=true});
$('#vPrev').addEventListener('click',function(){if(vPage>1)openPage(vPage-1)});
$('#vNext').addEventListener('click',function(){if(vPage<C().maxp)openPage(vPage+1)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#viewer').hidden=true});
$('#viewer').addEventListener('click',function(e){if(e.target.id==='viewer')$('#viewer').hidden=true});
window.addEventListener('hashchange',goHash);
(function(){var root=document.documentElement;var t=null;try{t=localStorage.getItem('mhh-theme-t')}catch(e){}if(t)root.setAttribute('data-theme',JSON.parse(t));$('#themeBtn').addEventListener('click',function(){var c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var n=c==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('mhh-theme-t',JSON.stringify(n))}catch(e){}})})();
if(!goHash()){var st='labor';try{st=localStorage.getItem('mhh-law-tab')||'labor'}catch(e){}if(!SETS[st])st='labor';load(st)}
})();
</script>
</body>
